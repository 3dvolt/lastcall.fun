<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <defs>
    <linearGradient id="lc-amber" x1="10" y1="14" x2="54" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe28f"/><stop offset="0.5" stop-color="#ffb020"/><stop offset="1" stop-color="#f26b13"/>
    </linearGradient>
    <radialGradient id="lc-glow" cx="32" cy="36" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb020" stop-opacity="0.20"/><stop offset="1" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#15110a"/>
  <rect width="64" height="64" rx="16" fill="url(#lc-glow)"/>
