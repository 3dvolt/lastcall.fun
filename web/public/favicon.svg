  <path d="M16 40C16.6 32.5 21.5 27.2 28 25.4" fill="none" stroke="#fff6dc" stroke-opacity="0.55" stroke-width="2.2" stroke-linecap="round"/>
  <!-- base -->
  <rect x="6.5" y="46" width="51" height="7" rx="3.5" fill="url(#lc-amber)"/>
  <!-- price line cut out of the dome: it holds above the (dashed) threshold at the close -->
