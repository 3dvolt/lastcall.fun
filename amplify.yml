version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - cd .. && npm ci && npm run build -w sdk && cd web
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files: ['**/*']
      cache:
        paths: [../node_modules/**/*]
    customHeaders:
      - pattern: '**'
        headers:
          - { key: 'Strict-Transport-Security', value: 'max-age=63072000; includeSubDomains; preload' }
          - { key: 'X-Content-Type-Options', value: 'nosniff' }
          - { key: 'Referrer-Policy', value: 'no-referrer' }
          - { key: 'X-Frame-Options', value: 'DENY' }
          - { key: 'Permissions-Policy', value: 'camera=(), microphone=(), geolocation=()' }
          - key: 'Content-Security-Policy'
            value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.devnet.solana.com wss://api.devnet.solana.com https://YOUR-RESOLVER-API https://YOUR-FAUCET-API; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
