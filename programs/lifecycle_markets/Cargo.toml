[package]
name = "lifecycle_markets"
version = "0.1.0"
description = "Binary prediction markets on the lifecycle of newly launched tokens (DEVNET DEMO)"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "lifecycle_markets"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.2.1", default-features = false, features = ["init-if-needed", "solana-v4"] }
anchor-spl = { version = "=1.2.1", default-features = false, features = ["token", "mint", "token_2022", "solana-v4"] }

[dev-dependencies]
litesvm = "0.17"
litesvm-token = "0.17"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3"
rand = "0.8"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
